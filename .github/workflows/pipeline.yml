name: Automated Data Engineering Pipeline (MotherDuck + dbt)

on:
  push:
    branches:
      - main
  schedule:
    # Run twice daily (every 12 hours)
    - cron: '0 */12 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  run-pipeline:
    name: Extract, Load & Transform (ELT)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 📦 Install Python & dbt Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Run Extract & Load Pipeline (Ingestion to MotherDuck SaaS)
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        run: |
          python scripts/extract_load.py

      - name: 🏗️ Run dbt Transformations (Medallion Architecture)
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          DBT_TARGET: "prod"
        run: |
          dbt run --project-dir dbt_project --profiles-dir dbt_project --target prod

      - name: 🧪 Execute dbt Data Quality & Integrity Tests
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          DBT_TARGET: "prod"
        run: |
          dbt test --project-dir dbt_project --profiles-dir dbt_project --target prod

      - name: ✅ Pipeline Execution Success Notification
        run: |
          echo "🎉 Data Engineering pipeline executed successfully!"
          echo "📊 MotherDuck SaaS updated & Streamlit Cloud ready to serve fresh data."
